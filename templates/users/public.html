{% extends "base.html" %}

{% block content %}
  {% set profile_score = account.score if account.place else none %}
  {% include "users/profile.html" %}
{% endblock %}

{% block scripts %}
  <script>
      window.USER = {{ {
      'type': 'user',
      'id': user.id,
      'name': user.name,
      'account_id': user.id,
    } | tojson }};
  </script>

  {{ Assets.js("assets/js/users/public.js") }}
{% endblock %}
